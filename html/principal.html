<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SafeControl · Gestão de EPI</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg:       #f0f4f8;
            --surface:  #ffffff;
            --surface2: #e8f0f7;
            --border:   #cfe0ef;
            --accent:   #1565c0;
            --accent-light: #1e88e5;
            --accent-hover: #0d47a1;
            --text:     #1a2a3a;
            --muted:    #6b8caa;
            --header-bg: #1565c0;
            --sidebar-bg: #f7fafd;
            --sidebar-w: 220px;
            --glow: 0 2px 12px rgba(21,101,192,.18);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Syne', sans-serif; min-height: 100vh;
            overflow-x: hidden;
        }

        .app { display: block; min-height: 100vh; }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.35);
            backdrop-filter: blur(3px); z-index: 90;
            display: none;
        }
        .overlay.active { display: block; }

        .sidebar {
            position: fixed; top: 0; left: calc(-1 * var(--sidebar-w));
            width: var(--sidebar-w); height: 100%;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 4px 0 24px rgba(21,101,192,.12);
        }
        .sidebar.active { transform: translateX(var(--sidebar-w)); }

        .sidebar-brand { padding: 1.2rem 1.2rem; border-bottom: 1px solid var(--border); }
        .logo-text { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; color: var(--muted); }
        .logo-text span { color: var(--muted); }
        .close-btn { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; border-radius: 6px; width: 32px; height: 32px; display: grid; place-items: center; transition: all .2s; }
        .close-btn:hover { border-color: var(--accent); color: var(--accent); }

        .sidebar-nav { padding: 1rem .8rem; display: flex; flex-direction: column; gap: .2rem; flex: 1; }

        .nav-item {
            display: flex; align-items: center; gap: .7rem;
            padding: .75rem .9rem; border-radius: 8px; cursor: pointer;
            font-size: .82rem; font-weight: 600; color: var(--muted);
            border: 1px solid transparent;
            transition: all .2s; text-decoration: none;
        }
        .nav-item svg { flex-shrink: 0; opacity: .6; transition: opacity .2s; }
        .nav-item:hover { background: #e3edf7; color: var(--accent); }
        .nav-item:hover svg { opacity: 1; }
        .nav-item.active {
            background: #ddeeff; color: var(--accent);
            border-color: #b3d4f5; font-weight: 700;
        }
        .nav-item.active svg { opacity: 1; }

        .sidebar-footer {
            padding: .9rem 1.2rem; border-top: 1px solid var(--border);
            font-family: 'DM Mono', monospace; font-size: .6rem; color: var(--muted);
        }

        .main-wrap { display: flex; flex-direction: column; min-height: 100vh; }

        .menu-toggle { background: #fff; border: 1px solid var(--border); color: var(--accent); padding: 8px 10px; cursor: pointer; border-radius: 6px; display: grid; place-items: center; transition: all .2s; }
        .menu-toggle:hover { border-color: var(--accent); background: #e8f0fb; box-shadow: var(--glow); }
        .logo-text-header { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 1.05rem; color: #fff; }
        .logo-text-header span { color: rgba(255,255,255,.75); }

        .page-header {
            padding: 1.2rem 2rem;
            background: var(--accent);
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 20;
            box-shadow: 0 2px 12px rgba(21,101,192,.25);
        }
        .page-header h1 {
            font-size: 1.45rem; font-weight: 800;
            letter-spacing: .06em; text-transform: uppercase; color: #fff;
        }
        .header-right { display: flex; align-items: center; gap: 1.2rem; }
        .status-bar {
            display: flex; align-items: center; gap: .4rem;
            font-family: 'DM Mono', monospace; font-size: .65rem;
            color: rgba(255,255,255,.75);
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #69f0ae; box-shadow: 0 0 6px #69f0ae; animation: blink 1.8s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }
        .clock { font-family: 'DM Mono', monospace; font-size: .75rem; color: rgba(255,255,255,.8); }

        .content { padding: 1.6rem 2rem; display: flex; flex-direction: column; gap: 1.4rem; }

        .content-section { display: none; flex-direction: column; gap: 1.4rem; animation: fadeUp .4s ease both; }
        .content-section.active { display: flex; }
        @keyframes fadeUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .title-bar { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: .75rem; }
        .title-bar h2 { font-size: 1.3rem; font-weight: 800; color: var(--accent); letter-spacing: -.01em; }
        .subtitle { font-family: 'DM Mono', monospace; font-size: .68rem; color: var(--muted); letter-spacing: .06em; margin-top: .2rem; }

        .actions { display: flex; gap: .6rem; }
        .btn { font-family: 'Syne', sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; border-radius: 6px; padding: .5rem 1.1rem; transition: all .2s; border: none; }
        .btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--accent); }
        .btn-ghost:hover { border-color: var(--accent); background: #e8f0fb; box-shadow: var(--glow); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--glow); }

        .frame-wrap {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(21,101,192,.1);
        }
        .frame-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: .75rem 1.3rem; border-bottom: 1px solid var(--border);
            background: var(--surface2);
        }
        .frame-title { display: flex; align-items: center; gap: .55rem; font-size: .78rem; font-weight: 600; color: var(--accent); }
        .traffic-lights { display: flex; gap: .4rem; }
        .tl { width: 10px; height: 10px; border-radius: 50%; }
        .tl-r { background: #ff5f57; } .tl-y { background: #ffbd2e; } .tl-g { background: #28c840; }

        iframe.dash {
            display: block; width: 100%;
            height: calc(100vh - 160px); min-height: 540px; border: none;
        }
        .frame-wrap:fullscreen { width:100vw; height:100vh; border-radius:0; display:flex; flex-direction:column; }
        .frame-wrap:fullscreen iframe.dash { height:100%; flex:1; }
        .frame-wrap:-webkit-full-screen { width:100vw; height:100vh; border-radius:0; display:flex; flex-direction:column; }
        .frame-wrap:-webkit-full-screen iframe.dash { height:100%; flex:1; }
    </style>
</head>
<body>
<div class="app">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand" style="display:flex;align-items:center;justify-content:space-between;">
            <div class="logo-text">SAFE<span>CONTROL</span></div>
            <button class="close-btn" onclick="toggleMenu()" aria-label="Fechar menu">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active" onclick="showSection('dash', this)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/>
                    <rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity=".5"/>
                    <rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".5"/>
                    <rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".3"/>
                </svg>
                Dashboard
            </div>
            <a href="http://localhost:8501" class="nav-item" style="text-decoration: none;">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M8 2l6 4-6 4-6-4 6-4zM2 10l6 4 6-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Relatórios e Previsões (IA)
            </a>
        </nav>
        <div class="sidebar-footer">SafeControl · Monitoramento Operacional</div>
    </aside>

    <div class="main-wrap">
        <div class="page-header">
            <div style="display:flex;align-items:center;gap:1rem;">
                <button class="menu-toggle" onclick="toggleMenu()" aria-label="Abrir menu">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="logo-text-header">SAFE<span>CONTROL</span></div>
            </div>
            <div class="header-right">
                <div class="status-bar"><span class="status-dot"></span>AO VIVO</div>
                <div class="clock" id="clock">00:00:00</div>
            </div>
        </div>

        <div class="content">
            <section id="dash" class="content-section active">
                <div class="title-bar">
                    <div>
                        <h2>Painel de Controle</h2>
                        <div class="subtitle">// SAFECONTROL · MONITORAMENTO OPERACIONAL · POWER BI</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-ghost" onclick="reloadBI()">↺ Atualizar</button>
                        <button class="btn btn-primary" onclick="goFullscreen()">⤢ Tela cheia</button>
                    </div>
                </div>
                <div class="frame-wrap" id="frameWrap">
                    <div class="frame-header">
                        <div class="frame-title">
                            <span style="width:8px;height:8px;border-radius:50%;background:#28c840;display:inline-block;box-shadow:0 0 6px #28c840;"></span>
                            Dashboard SafeControl · Power BI
                        </div>
                        <div class="traffic-lights">
                            <span class="tl tl-r"></span><span class="tl tl-y"></span><span class="tl tl-g"></span>
                        </div>
                    </div>
                    <!-- Adicionada a classe 'dash' e o 'id="biFrame"' -->
                    <iframe id="biFrame" class="dash" title="Dashboard SafeControl - Copia" src="https://app.powerbi.com/reportEmbed?reportId=7809aaa3-4e32-47e1-aabe-1d69e566539e&autoAuth=true&ctid=b77ab646-8d8c-44f2-869f-4cd1ec54c61d" frameborder="0" allowFullScreen="true"></iframe>
                </div>
            </section>
        </div>
    </div>
</div>

<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function showSection(id, el) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function reloadBI() {
        const f = document.getElementById('biFrame');
        if (f) f.src = f.src;
    }

    function goFullscreen() {
        const wrap = document.getElementById('frameWrap');
        if (wrap.requestFullscreen) wrap.requestFullscreen();
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
        else if (wrap.mozRequestFullScreen) wrap.mozRequestFullScreen();
    }

    setInterval(() => {
        const clockEl = document.getElementById('clock');
        if (clockEl) clockEl.textContent = new Date().toLocaleTimeString('pt-BR');
    }, 1000);
</script>
</body>
</html>
